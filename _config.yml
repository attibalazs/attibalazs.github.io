# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Exploratory Missions
description: >- # this means to ignore newlines until "baseurl:"
 The personal website of Atti Balazs, a hub for exploratory missions into the world of tech, showcasing a journey of impactful data science and ML innovations.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://attibalazs.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: attibalazs
github_username:  attibalazs

minimal_mistakes_skin: "dark" # Switching to dark for a cleaner dev look

# Site Author
author:
  name: "Attila Balazs"
  bio: "Data Science & ML Enthusiast"
  avatar: "/assets/images/avatar.jpeg" # Using an existing image as placeholder
  location: "London"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/attibalazs"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/attibalazs"

# Build settings
remote_theme: mmistakes/minimal-mistakes

# Default Layouts
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false # Disabled until a provider (Disqus/Giscus) is configured
      share: true
      related: true
      # Polishing social share buttons: Only show X/Twitter (and Reddit/Hacker News if desired, but disabling the cluttered ones)
      share_on_facebook: false
      share_on_linkedin: true # Keeping LinkedIn as it's professional
      share_on_twitter: true
      share_on_pinterest: false
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false # Clean pages don't usually need share buttons

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-seo-tag

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
